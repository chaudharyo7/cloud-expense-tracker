<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <div>
        <p class="eyebrow">AWS CLOUD PROJECT</p>
        <h1>Expense Tracker</h1>
        <p class="subtitle">Track expenses now. Generate cloud reports later.</p>
      </div>
      <div id="health" class="status">Checking API...</div>
    </header>

    <section class="grid">
      <div class="card">
        <h2>Add Expense</h2>
        <form id="expense-form">
          <label>
            Amount (₹)
            <input id="amount" type="number" min="0.01" step="0.01" required>
          </label>

          <label>
            Category
            <select id="category" required>
              <option value="">Select category</option>
              <option>Food</option>
              <option>Travel</option>
              <option>Shopping</option>
              <option>Education</option>
              <option>Bills</option>
              <option>Other</option>
            </select>
          </label>

          <label>
            Description
            <input id="description" type="text" maxlength="200" placeholder="e.g. Dinner">
          </label>

          <label>
            Date
            <input id="expense-date" type="date" required>
          </label>

          <button type="submit">Add Expense</button>
          <p id="message" class="message"></p>
        </form>
      </div>

      <div class="card">
        <div class="section-heading">
          <h2>Summary</h2>
          <span id="expense-count">0 expenses</span>
        </div>

        <div class="summary">
          <div>
            <span>Total</span>
            <strong id="total">₹0.00</strong>
          </div>
          <div>
            <span>This Month</span>
            <strong id="month-total">₹0.00</strong>
          </div>
        </div>

        <button id="report-button" class="secondary" disabled>
          Generate Report (AWS Lambda — later)
        </button>
      </div>
    </section>

    <section class="card">
      <div class="section-heading">
        <h2>Recent Expenses</h2>
        <button id="refresh" class="small">Refresh</button>
      </div>

      <div id="empty" class="empty">No expenses yet.</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Category</th>
              <th>Description</th>
              <th>Amount</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="expense-list"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
